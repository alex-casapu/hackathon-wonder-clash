<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GlitchOut Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik+Glitch&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/brand.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--void);color:var(--w);font-family:var(--f-body);font-size:20px;line-height:1.05;overflow:hidden;touch-action:manipulation;
  background-image:radial-gradient(ellipse at 50% 0,#0b2a18,transparent 62%)}
#app{height:100%;display:flex;flex-direction:column;padding:0 12px 12px;gap:9px;overflow:auto}
.top{display:flex;align-items:center;gap:8px;background:var(--r);color:#fff;margin:0 -12px;padding:4px 12px;text-transform:uppercase;font-size:22px;flex:none}
.top .p{background:#fff;color:var(--r);padding:0 6px}
.chip{margin-left:auto;padding:0 8px;background:var(--tc);color:#000}
.timer{font-variant-numeric:tabular-nums;color:var(--y);min-width:2.2em;text-align:right}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
h1{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1;margin:0;text-transform:uppercase;color:#e8fff1}
h2{font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1;margin:6px 0 0;text-transform:uppercase;color:#e8fff1}
p{margin:0;color:var(--ph);font-size:20px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.card{background:var(--card);border-radius:8px;padding:4px;color:#000;position:relative;box-shadow:0 8px 12px -6px #000;transition:transform .1s}
.card:active{transform:scale(.98)}
.card .im{aspect-ratio:1;position:relative;border:2px solid #000}.card .im .gs,.card .im .ic{position:absolute;inset:0;background-position:50% 22%}
.card .im .ic{display:flex;align-items:center;justify-content:center;font-size:56px;background:#111}
.card .cp{background:var(--y);border:2px solid #000;border-top:0;padding:1px 6px 4px;text-align:left}
.card b{font-family:var(--f-disp);font-weight:400;font-size:19px;text-transform:uppercase;display:block;line-height:1}
.card small{display:block;font-size:15px;line-height:.9;text-transform:uppercase;margin-top:2px;min-height:28px}
.card.sel{box-shadow:0 0 0 3px var(--m),0 0 18px var(--m)}
.card.sel::after{content:'YOUR PICK';position:absolute;top:-8px;right:-4px;background:var(--m);color:#000;font-family:var(--f-bang);font-size:15px;padding:1px 8px;border:2px solid #000;transform:rotate(5deg)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.side .card.mine{box-shadow:0 0 0 3px var(--c),0 0 18px var(--c)}.side .card.mine::after{content:'YOU PUSH THIS ONE';position:absolute;top:-8px;left:-4px;background:var(--c);color:#000;font-family:var(--f-bang);font-size:13px;padding:1px 8px;border:2px solid #000;transform:rotate(-4deg)}
button{font:inherit;font-size:22px;color:#000;border:0;border-radius:0;background:var(--y);padding:10px 4px;text-transform:uppercase}
button:active{filter:brightness(.8)}
button:disabled{opacity:.35}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moves button{padding:10px 2px;line-height:.95}
.moves button:nth-child(1){background:var(--r)}.moves button:nth-child(2){background:var(--ph)}.moves button:nth-child(3){background:var(--y)}
.moves button.sel{box-shadow:0 0 0 3px #fff inset,0 0 0 3px var(--tc)}
.taunts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.taunts button{font-size:17px;padding:8px 3px;background:var(--c);line-height:.95}
.taunts.cd button{opacity:.35}
#tap{flex:1;min-height:110px;background:var(--tc);clip-path:var(--burst);font-family:var(--f-disp);font-size:60px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:transform .05s;color:#000;line-height:.9;margin:0 -6px}
#tap:active{transform:scale(.94)}
#tap small{font-family:var(--f-body);font-size:20px;letter-spacing:.04em}
.bar{height:11px;background:repeating-linear-gradient(90deg,#222 0 7px,#000 7px 9px);overflow:hidden}.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--tc) 0 7px,#000 7px 9px);transition:width .3s}
.hp{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:19px;color:var(--ph);text-transform:uppercase}
.big{font-size:70px}
.back{display:flex;align-items:center;gap:8px;background:var(--card);color:#000;padding:4px 6px;border-radius:6px;box-shadow:0 0 0 3px var(--tc)}
.back .th{width:42px;height:42px;position:relative;border:2px solid #000;flex:none}.back .th .gs{position:absolute;inset:0;background-position:50% 22%}
.back span{flex:1;font-family:var(--f-disp);font-size:19px;text-transform:uppercase;line-height:1}.back button{padding:6px 10px;font-size:19px;background:#000;color:var(--y)}
.call{background:var(--y);color:var(--r);padding:6px;text-align:center;font-family:var(--f-bang);font-size:25px;line-height:1;text-transform:uppercase;-webkit-text-stroke:2px #000;paint-order:stroke fill;animation:pulse .5s steps(1) infinite}
@keyframes pulse{50%{background:var(--r);color:var(--y)}}
.result{font-family:var(--f-bang);font-size:56px;line-height:1;text-transform:uppercase;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000}
body:not(.fx){--f-disp:Impact,'Arial Black','Helvetica Neue',sans-serif}
body:not(.fx).crt::after{display:none!important}
body:not(.fx) .dA,body:not(.fx) .dB,body:not(.fx) .dG,body:not(.fx) .dY{filter:none!important}
body:not(.fx) .gs::before,body:not(.fx) .gs::after,body:not(.fx) .gl::before,body:not(.fx) .gl::after,body:not(.fx) .trk,body:not(.fx) .sky{display:none!important}
</style></head><body class="crt"><div id="app"></div>
<script src="/assets/art.js"></script><script src="/assets/brand.js"></script>
<script>
const $=document.getElementById('app');let me=null,S=null,pending=0,sig='',offer=[],tcdUntil=0,tcdTimer=null;
const post=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:me,...b})}).then(r=>r.json()).catch(()=>({}));
async function join(){const r=await post('/api/join',{id:localStorage.pid});me=r.id;localStorage.pid=me;connect()}
function connect(){const es=new EventSource('/events?pid='+me);es.onmessage=e=>{S=JSON.parse(e.data);if(!S.you){join();return}render()};}
const COL={A:'var(--A)',B:'var(--B)'},sec=ms=>Math.ceil(ms/1000);
// small JPEG thumbnail (c.thumb) for phones; duotone class: per character in casting, per corner once chosen
const pic=(c,cls)=>{const u=c.thumb||c.img;return u?`<div class="gs ${cls}" style="--img:url(${u})"></div>`:`<div class="ic">${c.icon}</div>`};
function newOffer(){offer=[...S.taunts].sort(()=>Math.random()-.5).slice(0,3)}
function topBar(){const y=S.you;return `<div class="top"><span class="p">P666</span><span>GlitchOut Fighter</span>${y.team?`<span class="chip" style="--tc:${COL[y.team]}">Team ${S[y.team].corner}</span>`:''}<span class="timer" ${y.team?'':'style="margin-left:auto"'}>${S.rem?sec(S.rem)+'s':''}</span></div>`}
function sideCards(y){return `<div class="side">${['A','B'].map(k=>{const x=S[k];return `<div class="card ${y.team===k?'mine':''}" style="--c:${COL[k]}" onclick="side('${k}')"><div class="im">${x.char?pic(x.char,BR.corner(k)):''}</div><div class="cp"><b>${x.name}</b><small>${x.n} fans</small></div></div>`}).join('')}</div>`}
function render(){
  if(!S||!S.you)return;const y=S.you,t=y.team?S[y.team]:null,o=y.team?S[y.team==='A'?'B':'A']:null;
  document.documentElement.style.setProperty('--tc',y.team?COL[y.team]:'var(--ph)');
  const cd=Date.now()<tcdUntil,callOn=S.call&&y.team&&(S.call.team==='both'||S.call.team===y.team);
  const key=[S.phase,S.beat,S.beatPhase,y.vote,y.team,y.move,callOn?S.call.seq:0,cd].join('|');
  if(S.phase==='fight'&&sig===key){updateFight();return}
  let h=topBar();
  if(S.phase==='lobby')h+=`<div class="center">${BR.ART.saucer(7)}<h1>Welcome to GlitchOut Fighter</h1><p>${S.players} people are in · waiting for the start</p></div>`;
  else if(S.phase==='casting'){h+=`<h2>Who should fight? Vote for your favorite!</h2><div class="cards">${S.roster.map(c=>`<div class="card ${y.vote===c.id?'sel':''}" onclick="vote('${c.id}')"><div class="im">${pic(c,BR.duo(c.id))}</div><div class="cp"><b>${c.name}</b><small>${c.tagline}</small></div></div>`).join('')}</div><p style="text-align:center">The two most voted characters will fight.</p>`}
  else if(S.phase==='generating'){h+=`<h2>The fighters are ready! Pick who you push for</h2>${sideCards(y)}<p style="text-align:center">You can switch sides any time (every 3 seconds).</p>`}
  else if(S.phase==='fight'){
    h+=`<div class="back" style="--tc:${COL[y.team]}">${t.char?`<div class="th">${pic(t.char,BR.corner(y.team))}</div>`:''}<span>You push: ${t.name}</span><button onclick="side('${y.team==='A'?'B':'A'}')">Switch</button></div>`;
    h+=`<div class="hp"><div>${t.name} ${t.hp}/${t.maxhp}<div class="bar"><i style="width:${100*t.hp/t.maxhp}%"></i></div></div><div>${o.name} ${o.hp}/${o.maxhp}<div class="bar" style="--tc:#888"><i style="width:${100*o.hp/o.maxhp}%"></i></div></div></div>`;
    if(callOn)h+=`<div class="call">${S.call.text}</div>`;
    h+=`<p style="text-align:center">Round ${S.beat}/${S.beats} · ${S.beatPhase==='vote'?'pick a move and TAP!':'watch the screen'}</p>`;
    const MV=[['attacco','Attack'],['guardia','Guard'],['speciale',t.special]];
    h+=`<div class="moves">${MV.map(([m,l])=>`<button class="${y.move===m?'sel':''}" ${S.beatPhase!=='vote'?'disabled':''} onclick="move('${m}')">${l}</button>`).join('')}</div>`;
    if(!offer.length)newOffer();
    h+=`<div class="taunts ${cd?'cd':''}">${offer.map(x=>`<button ${cd?'disabled':''} onclick="taunt('${x.id}')">${x.short}</button>`).join('')}</div>`;
    h+=`<div class="bar"><i style="width:${100*t.charge}%"></i></div><div id="tap" ontouchstart="tap(event)" onmousedown="tap(event)">${BR.gl('TAP!')}<small>${y.taps} taps</small></div>`;
  }
  else if(S.phase==='result'){const w=S.winner===y.team;h+=`<div class="center"><div class="result" style="color:${w?'var(--y)':'var(--r)'}">${w?'Victory!':'Defeat'}</div><p>${S[S.winner].name} wins the match.${S.mvp&&S.mvp.team===y.team&&y.taps===S.mvp.taps?' You are the top tapper on your team!':''} You tapped ${y.taps} times.</p></div>`}
  sig=key;$.innerHTML=h;
}
function updateFight(){const y=S.you,t=S[y.team],o=S[y.team==='A'?'B':'A'],b=document.querySelectorAll('.bar i');if(b.length>=3){b[0].style.width=100*t.hp/t.maxhp+'%';b[1].style.width=100*o.hp/o.maxhp+'%';b[2].style.width=100*t.charge+'%'}const tm=document.querySelector('.timer');if(tm)tm.textContent=sec(S.rem)+'s'}
const vote=c=>{post('/api/vote',{char:c});S.you.vote=c;sig='';render()};
const side=k=>{if(S.you.team===k)return;post('/api/side',{side:k});S.you.team=k;sig='';render();navigator.vibrate&&navigator.vibrate(15)};
const move=m=>{post('/api/move',{move:m});S.you.move=m;sig='';render();navigator.vibrate&&navigator.vibrate(15)};
function taunt(tid){post('/api/taunt',{tid});navigator.vibrate&&navigator.vibrate([20,40,20]);tcdUntil=Date.now()+3000;newOffer();sig='';render();clearTimeout(tcdTimer);tcdTimer=setTimeout(()=>{sig='';render()},3050)}
function tap(e){e.preventDefault();pending++;if(S&&S.you)S.you.taps++;navigator.vibrate&&navigator.vibrate(8);const s=document.querySelector('#tap small');if(s)s.textContent=S.you.taps+' taps'}
setInterval(()=>{if(pending){const n=pending;pending=0;post('/api/tap',{n})}},400);
join();
if(new URLSearchParams(location.search).has('fx'))document.body.classList.add('fx');
</script></body></html>
