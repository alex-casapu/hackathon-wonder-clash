<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weird Wrestling — Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik+Glitch&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/brand.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--w);font-family:var(--f-body);font-size:3vh;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 0,#0b2a18,transparent 62%)}
#app{height:100vh;display:flex;flex-direction:column;padding:0 2.2vw 6vh;gap:1.2vh;position:relative}
#body{flex:1;display:flex;flex-direction:column;min-height:0;gap:1.2vh}
.head{display:flex;align-items:center;gap:1.2vw;background:var(--r);color:#fff;padding:.3vh 2.2vw;margin:0 -2.2vw;font-size:3.6vh;text-transform:uppercase;line-height:1.1}
.head .p{background:#fff;color:var(--r);padding:0 .5vw}
.head .title{font-family:var(--f-disp);font-size:4.6vh;line-height:1}
#hmid{margin-left:auto;color:var(--y)}#hr{min-width:6vw;text-align:right}
/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.hs{display:flex;flex-direction:column;gap:.5vh}.hs.r{text-align:right}
.tname{font-size:3vh;color:var(--c);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}.hs.r .tname{flex-direction:row-reverse}
.hp{height:4.2vh;background:repeating-linear-gradient(90deg,#222 0 1.1vh,#000 1.1vh 1.45vh);position:relative;overflow:hidden}
.hp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 1.1vh,#000 1.1vh 1.45vh);transition:width .8s}
.hs.r .hp i{margin-left:auto}
.hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:3.2vh;text-transform:uppercase;color:#fff;text-shadow:0 0 .5vh #000,.2vh .2vh 0 #000,-.2vh -.2vh 0 #000}
.charge,.tilt{height:.8vh;background:#111;overflow:hidden}.charge i{display:block;height:100%;background:var(--y);transition:width .2s}.tilt i{display:block;height:100%;background:var(--r);transition:width .3s}
.hs.r .charge i,.hs.r .tilt i{margin-left:auto}
.hs.speaking .hp{box-shadow:0 0 2.2vh var(--c);outline:.3vh solid var(--c)}
/* stage */
.stage{flex:1;position:relative;background:#000;border:.7vh solid var(--card);border-radius:1vh;box-shadow:0 0 0 .3vh #000,0 2vh 4vh -1vh #000c;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s}
#mock{position:absolute;inset:0;display:flex;gap:.6vw;padding:0}
.mk{flex:1;height:100%;position:relative;overflow:hidden}
.mk .gs,.mk .ic{width:100%;height:100%;background-position:50% 22%;animation:float 3s ease-in-out infinite}
.mk .ic{display:flex;align-items:center;justify-content:center;font-size:22vh}
.mk::after{content:"";position:absolute;left:50%;top:44%;width:16vh;height:16vh;margin:-8vh;border:.3vh solid var(--c);border-radius:50%;box-shadow:0 0 1.6vh var(--c),inset 0 0 1.6vh var(--c);z-index:3;pointer-events:none}
#mkA::after{border-color:var(--A);box-shadow:0 0 1.6vh var(--A),inset 0 0 1.6vh var(--A)}
@keyframes float{50%{transform:translateY(-1.2vh)}}
.hit{animation:shake .5s!important}@keyframes shake{20%{transform:translateX(-3vh)}40%{transform:translateX(3vh)}60%{transform:translateX(-2vh)}80%{transform:translateX(2vh)}}
.dmg{position:absolute;top:18%;font-family:var(--f-bang);font-size:11vh;color:var(--y);-webkit-text-stroke:.5vh #000;paint-order:stroke fill;text-shadow:.6vh .6vh 0 var(--c);animation:pop 1.8s forwards;pointer-events:none;z-index:6}
@keyframes pop{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-8vh)}}
.nameplate{position:absolute;bottom:1.2vh;font-family:var(--f-disp);font-size:4.2vh;text-transform:uppercase;background:#000c;padding:.2vh 1vw;border-bottom:.5vh solid currentColor;z-index:4}
/* moves: teletext fastext colours */
.moves{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.mrow{display:flex;gap:.8vw}
.mv{flex:1;padding:.7vh;text-align:center;font-size:3vh;text-transform:uppercase;position:relative;overflow:hidden;color:#000}
.mv[data-m=attacco]{background:var(--r)}.mv[data-m=guardia]{background:var(--ph)}.mv[data-m=speciale]{background:var(--y)}
.mv i{position:absolute;left:0;bottom:0;height:.7vh;background:#000;transition:width .3s}
/* overlays */
#ov{position:absolute;left:0;right:0;top:16vh;z-index:46;text-align:center;pointer-events:none}
.banner{font-family:var(--f-disp);font-size:8vh;text-transform:uppercase;color:#fff;text-shadow:0 0 4vh #000,0 0 2vh #3dff8f66}
.banner small{font-size:.5em;color:var(--y)}
.banner.pop{animation:pop2 2.4s forwards}
@keyframes pop2{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
.win{font-family:var(--f-bang);font-size:13vh;text-transform:uppercase;line-height:1;-webkit-text-stroke:.7vh #000;paint-order:stroke fill;text-shadow:.8vh .8vh 0 #000}
#status{position:absolute;left:50%;top:1.5vh;transform:translateX(-50%);z-index:5;font-size:3vh;background:#000c;border:.3vh solid var(--ph);padding:.4vh 2vh;color:var(--ph);display:none;text-transform:uppercase}
/* host figurine */
#pop{position:absolute;left:1.5vw;bottom:8vh;z-index:6;width:16vh;display:flex;flex-direction:column;align-items:center;transition:transform .2s;background:var(--card);padding:.6vh;border-radius:.8vh;box-shadow:0 1vh 2vh #000a}
#pop .gs{width:100%;aspect-ratio:3/4}
#pop .live{background:var(--r);color:#fff;font-size:2.4vh;letter-spacing:.12em;padding:0 1vh;margin-top:-1.6vh;z-index:1;text-transform:uppercase;box-shadow:0 0 0 .3vh #000}
#pop .eq{display:flex;gap:.4vh;align-items:flex-end;height:2.4vh;opacity:0;margin-top:.4vh}
#pop .eq i{display:block;width:.8vh;height:30%;background:#000}
#pop.talk{transform:scale(1.1)}#pop.talk .gs{animation:bob .35s infinite alternate}#pop.talk .eq{opacity:1}
#pop.talk .eq i{animation:eq .4s infinite alternate}#pop.talk .eq i:nth-child(2){animation-delay:.1s}#pop.talk .eq i:nth-child(3){animation-delay:.2s}#pop.talk .eq i:nth-child(4){animation-delay:.05s}
@keyframes eq{to{height:100%}}@keyframes bob{to{transform:translateY(-.8vh) rotate(-2deg)}}
/* call-out burst */
#call{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);z-index:7;width:46vh;height:30vh;background:var(--y);clip-path:var(--burst);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--f-bang);text-transform:uppercase;color:var(--r);line-height:.9;animation:pu .6s steps(1) infinite}
@keyframes pu{50%{transform:translate(-50%,-50%) rotate(-5deg) scale(1.06)}}
#call b{font-weight:400;font-size:8.6vh;-webkit-text-stroke:.35vh #000;paint-order:stroke fill;padding:0 3vh}#call b.long{font-size:5.4vh}
#call span{font-family:var(--f-body);color:#000;font-size:3vh;margin-top:.8vh;padding:0 4vh;line-height:.95}
.bub{position:absolute;top:34%;z-index:6;animation:bub 2.2s forwards}
@keyframes bub{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.05)}85%{opacity:1}100%{opacity:0;transform:translateY(-4vh)}}
#unlock{position:fixed;top:1vh;left:50%;transform:translateX(-50%);z-index:60;background:var(--y);color:#000;font-size:3vh;padding:.4vh 2vh;cursor:pointer;text-transform:uppercase}
/* lobby */
.lobby{flex:1;display:flex;align-items:center;justify-content:center;gap:6vw;position:relative}
.qr{background:var(--card);padding:1.6vh;border-radius:1vh;width:50vh;height:50vh;box-shadow:0 0 0 .4vh #000,0 0 6vh #3dff8f44}.qr img{width:100%;height:100%;background:#fff}
.big{font-family:var(--f-disp);font-size:9.5vh;line-height:1;text-transform:uppercase;color:#e8fff1;text-shadow:0 0 3vh #3dff8f66}
.sub{font-size:3.6vh;color:var(--ph);margin-top:1.2vh;text-transform:uppercase;line-height:1}
.cnt{margin-top:3vh;font-family:var(--f-disp);font-size:7vh;color:var(--y)}.cnt small{font-family:var(--f-body);font-size:3.4vh;color:var(--c);margin-left:1vw;text-transform:uppercase}
.keys{margin-top:2vh;font-size:2.6vh;color:var(--ph);opacity:.8;text-transform:uppercase}
.sky{position:absolute;pointer-events:none;animation:fly 14s linear infinite;opacity:.55;z-index:0}
.lobby>div:not(.sky){position:relative;z-index:1}@keyframes fly{from{left:-12%}to{left:104%}}
/* casting: figurine cards */
.cast{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2.2vh 1.6vw;min-height:0;padding-top:.8vh}
.cc{background:var(--card);border-radius:.9vh;padding:.7vh;display:flex;flex-direction:column;min-height:0;position:relative;color:#000;box-shadow:0 1.4vh 2vh -1vh #000;transition:transform .3s,box-shadow .3s}
.cc.top{transform:scale(1.03);box-shadow:0 0 0 .6vh var(--y),0 0 5vh #ffe60066;z-index:2}
.cc .im{flex:1;min-height:0;position:relative;border:.3vh solid #000}
.cc .im .gs,.cc .im .ic{position:absolute;inset:0;background-position:50% 22%}
.cc .im .ic{display:flex;align-items:center;justify-content:center;font-size:9vh;background:#111}
.cc .im::after{content:"";position:absolute;left:50%;top:44%;width:10vh;height:10vh;margin:-5vh;border:.25vh solid var(--cc,var(--c));border-radius:50%;opacity:.8;z-index:3;box-shadow:0 0 1.2vh var(--cc,var(--c))}
.cc .id{position:absolute;left:.8vh;top:.4vh;z-index:4;font-size:2.4vh;color:var(--cc,var(--c));text-shadow:0 0 .8vh #000,.15vh .15vh 0 #000;text-transform:uppercase}
.cc .cp{background:var(--y);border:.3vh solid #000;border-top:0;padding:.2vh 1vh .6vh}
.cc .cp b{font-family:var(--f-disp);font-weight:400;font-size:3.8vh;text-transform:uppercase;line-height:1;display:block}
.cc .cp small{display:block;font-size:2.4vh;line-height:.95;text-transform:uppercase;height:2.3vh;overflow:hidden;margin:.2vh 0 0}
.cc .vb{height:1.8vh;margin-top:.6vh;background:repeating-linear-gradient(90deg,#999 0 .8vh,#000 .8vh 1.05vh);position:relative;overflow:hidden}
.cc .vb i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cc,var(--c)) 0 .8vh,#000 .8vh 1.05vh);transition:width .4s}
.cc .vn{position:absolute;right:-1vh;top:-1.6vh;z-index:5;background:var(--y);color:#000;border:.3vh solid #000;font-family:var(--f-disp);font-size:3.8vh;line-height:1;padding:.2vh 1vh;transform:rotate(6deg)}
.cc .rk{position:absolute;left:-1vh;top:-1.6vh;z-index:5;background:var(--r);color:#fff;border:.3vh solid #000;font-family:var(--f-bang);font-size:3.2vh;line-height:1;padding:.3vh 1vh;transform:rotate(-6deg)}
/* generating */
.gen{flex:1;display:flex;align-items:center;justify-content:center;gap:3vw;min-height:0;position:relative}
.gen .fc{height:100%;max-height:64vh;aspect-ratio:3/4;background:var(--card);padding:.8vh;border-radius:1vh;display:flex;flex-direction:column;min-height:0;color:#000;box-shadow:0 0 0 .4vh #000,0 2vh 4vh -1vh #000}
.gen .fc .im{flex:1;min-height:0;position:relative;border:.3vh solid #000}.gen .fc .im .gs,.gen .fc .im .ic{position:absolute;inset:0;background-position:50% 22%;background-size:cover}
.gen .fc .im .ic{display:flex;align-items:center;justify-content:center;font-size:20vh;background:#111}
.gen .fc .cp{background:var(--y);border:.3vh solid #000;border-top:0;padding:.4vh 1.2vh .8vh}
.gen .fc b{font-family:var(--f-disp);font-weight:400;font-size:4.6vh;text-transform:uppercase;display:block;line-height:1}.gen .fc small{font-size:2.8vh;text-transform:uppercase;line-height:1}
.gen .vs{font-family:var(--f-bang);font-size:10vh;color:var(--r);background:var(--y);width:24vh;height:24vh;clip-path:var(--burst);display:flex;align-items:center;justify-content:center;-webkit-text-stroke:.4vh #000;paint-order:stroke fill;transform:rotate(-6deg);flex:none}
.tag{position:fixed;bottom:7vh;right:1vw;font-size:2.2vh;color:var(--ph);opacity:.7;z-index:41}
</style></head><body class="crt"><div id="app"><div class="head"><span class="p">P666</span><span class="title gl" data-t="Weird Wrestling">Weird Wrestling</span><span id="hmid"></span><span id="hr"></span></div><div id="body"></div><div id="ov"></div></div><div class="tag" id="tag"></div><div id="unlock">Sound off — click anywhere to enable</div>
<script src="/assets/art.js"></script><script src="/assets/brand.js"></script>
<script>
const COL={A:'#ff3fa4',B:'#00f0ff'},$=id=>document.getElementById(id);
let S=null,mode='',fx={},ovT=null,act=0,curSeq=0,preSeq=0,audioOK=false,sayT=null,voice=null;
fetch('/info').then(r=>r.json()).then(j=>{$('tag').textContent=(j.live?'MachGen LIVE':'MOCK')+' · '+j.url});
const es=new EventSource('/events');es.onmessage=e=>{S=JSON.parse(e.data);render()};
const sec=ms=>Math.ceil(ms/1000);
const adm=c=>fetch('/admin/'+c).catch(()=>{});
function unlock(){if(audioOK)return;audioOK=true;$('unlock').style.display='none';[0,1].forEach(i=>$('v'+i)&&($('v'+i).muted=false))}
addEventListener('click',unlock);
addEventListener('keydown',e=>{unlock();if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key===' '){e.preventDefault();adm(S.phase==='lobby'?'start':'skip')}if(e.key==='r')adm('reset');if(e.key==='b')adm('bots?n=20');if(e.key==='f')document.documentElement.requestFullscreen?.();if(e.key==='x')adm('halt')});
function ov(html,ms){clearTimeout(ovT);$('ov').innerHTML=html;if(ms)ovT=setTimeout(()=>{$('ov').innerHTML=''},ms)}
// character picture: duotone slice-shift image, or the emoji icon if no portrait exists. cls = dA/dB/dG/dY
const pic=(c,cls)=>c.img?`<div class="gs ${cls}" style="--img:url(${c.img})"></div>`:`<div class="ic">${c.icon}</div>`;
const MVL=(k,m)=>m==='speciale'?`${S[k].special}`:m==='attacco'?'Attack':'Guard';

function render(){
  if(!S)return;
  const lab={vote:'VOTE & TAP',lock:'VOTES LOCKED',finale:'FINALE'}[S.beatPhase]||'';
  $('hmid').textContent=S.phase==='fight'?`Round ${S.beat}/${S.beats} · ${lab}`:S.phase==='casting'?'ALERT · WHO DEFENDS EARTH?':S.phase;
  $('hr').textContent=S.rem&&S.phase!=='generating'?sec(S.rem)+'s':'';
  if(['fight','result'].includes(S.phase)){ if(mode!=='arena'){buildArena();mode='arena';} updateArena(); }
  else { mode=S.phase; fx.ov='';curSeq=0;preSeq=0;fx.beat=0;fx.say=0;fx.fx=0; $('body').innerHTML=staticView(); ov(''); }
}
function staticView(){
  const A=BR.ART;
  if(S.phase==='lobby')return `<div class="lobby"><div class="sky" style="top:4%">${A.saucer(8)}</div><div class="sky" style="top:70%;animation-duration:20s;animation-delay:-9s">${A.alien(6)}</div><div class="qr"><img src="/qr.svg"></div><div><div class="big">${BR.gl('Scan.')}<br>Pick your fighter.</div><div class="sub">Six weirdos. The crowd picks two. Then YOU decide who wins.</div>
    <div class="cnt">${S.players}<small>people in</small></div><div class="keys">[space] start · [b] +20 bots · [r] reset · [x] STOP ALL · [d] debug · [f] fullscreen</div></div></div>`;
  if(S.phase==='casting'){const mx=Math.max(1,...S.roster.map(c=>c.votes)),rank=[...S.roster].sort((a,b)=>b.votes-a.votes).map(c=>c.id);
    return `<div class="cast">${S.roster.map((c,i)=>{const r=rank.indexOf(c.id),top=r<2&&c.votes>0,d=BR.duo(c.id),cc={dA:'var(--A)',dB:'var(--B)',dG:'var(--ph)',dY:'var(--y)'}[d];return `<div class="cc ${top?'top':''}" style="--cc:${cc}"><div class="im">${pic(c,d)}<span class="id">DEF-0${i+1}</span></div><div class="cp"><b>${c.name}</b><small>${c.tagline}</small></div><div class="vb"><i style="width:${100*c.votes/mx}%"></i></div><span class="vn">${c.votes}</span>${top?`<span class="rk">#${r+1}</span>`:''}</div>`}).join('')}</div>`}
  if(S.phase==='generating'){const f=(k)=>{const x=S[k];return `<div class="fc" style="--c:${COL[k]}"><div class="im">${x.char?pic(x.char,BR.corner(k)):''}</div><div class="cp"><b>${x.name}</b><small>${x.n} fans · ${x.char?x.char.tagline:''}</small></div></div>`};
    return `<div class="gen">${f('A')}<div class="vs">VS</div>${f('B')}</div><div class="sub" style="text-align:center">Getting the ring ready… pick your side on your phone!</div>`}
  return '';
}
function buildArena(){
  $('body').innerHTML=`<div class="hud">${['A','B'].map(k=>`<div class="hs ${k==='B'?'r':''}" style="--c:${COL[k]}"><div class="tname" id="tn${k}"></div><div class="hp"><i id="hpi${k}"></i><b id="hpb${k}"></b></div><div class="charge"><i id="ch${k}"></i></div><div class="tilt"><i id="tl${k}"></i></div></div>`).join('')}</div>
  <div class="stage" id="stage"><video id="v0" playsinline></video><video id="v1" playsinline></video><div id="mock"></div><div class="trk"></div>
    <div class="nameplate" id="npA" style="left:2vw;color:${COL.A}"></div><div class="nameplate" id="npB" style="right:2vw;color:${COL.B}"></div><div id="status"></div><div id="call"></div>
    <div id="pop"><div class="gs dY" style="--img:url(/assets/host.jpg)"></div><span class="live">● LIVE</span><div class="eq"><i></i><i></i><i></i><i></i></div></div></div>
  <div class="moves">${['A','B'].map(k=>`<div class="mrow" id="mv${k}" style="--c:${COL[k]}">${['attacco','guardia','speciale'].map(m=>`<div class="mv" data-m="${m}"><span></span><i></i></div>`).join('')}</div>`).join('')}</div>`;
  [0,1].forEach(i=>{$('v'+i).muted=!audioOK;$('v'+i).volume=0.55});act=0;curSeq=0;preSeq=0;fx.mockKey='';
  // if the next clip is late, replay the last 2.5s in a loop instead of freezing on the last frame
  [0,1].forEach(i=>$('v'+i).addEventListener('ended',e=>{if(e.target===vid(act)&&S&&S.phase==='fight'){e.target.currentTime=Math.max(0,(e.target.duration||3)-2.5);e.target.play().catch(()=>{})}}));
}
const vid=i=>$('v'+i);
function syncVideo(){
  const v=S.video,n=S.next;
  if(n&&n.url&&preSeq!==n.seq){preSeq=n.seq;const el=vid(1-act);el.dataset.seq=n.seq;el.src=n.url;el.preload='auto';el.load()}
  if(v&&v.seq&&v.seq!==curSeq){
    curSeq=v.seq;if(!v.url)return;
    const el=vid(1-act);if(el.dataset.seq!=v.seq){el.dataset.seq=v.seq;el.src=v.url}
    el.muted=!audioOK;el.volume=speaking?0.12:0.55;el.currentTime=0;el.play().catch(()=>{});el.style.opacity=1;const old=vid(act);old.style.opacity=0;setTimeout(()=>old.pause(),250);act=1-act;
    $('mock').style.display='none';
  }
}
function setMock(){ // no generated video: show the two portraits
  const k=S.A.char&&S.B.char?S.A.char.id+S.B.char.id:'';if(fx.mockKey===k)return;fx.mockKey=k;if(!k)return;
  $('mock').innerHTML=['A','B'].map(c=>`<div class="mk" id="mk${c}">${pic(S[c].char,BR.corner(c))}</div>`).join('');
}
function updateArena(){
  for(const k of ['A','B']){const x=S[k];
    $('tn'+k).innerHTML=`<span>${x.corner} corner</span><span>${x.n} fans</span>`;
    $('hpi'+k).style.width=100*x.hp/x.maxhp+'%';$('hpb'+k).textContent=`${x.name} — ${x.hp} / ${x.maxhp}`;
    $('ch'+k).style.width=100*x.charge+'%';$('tl'+k).style.width=100*x.tilt/0.3+'%';$('np'+k).textContent=x.name;
    $('mv'+k).style.visibility=S.phase==='fight'&&S.beatPhase==='vote'?'visible':'hidden';
    const tot=Math.max(1,x.n);$('mv'+k).querySelectorAll('.mv').forEach(d=>{const m=d.dataset.m;d.firstChild.textContent=`${MVL(k,m)} ${x.moveVotes[m]}`;d.lastChild.style.width=100*x.moveVotes[m]/tot+'%'});
  }
  if(!S.live)setMock();
  syncVideo();
  if(S.phase==='fight'&&S.beat===1&&!S.last&&fx.ov!=='vs'){fx.ov='vs';ov(`<div class="banner pop">${S.A.name} <small>VS</small> ${S.B.name}</div>`,3000)}
  if(S.phase==='result'&&fx.ov!=='result'){fx.ov='result';ov(`<div class="win" style="color:${COL[S.winner]}">★ ${S[S.winner].name} wins! ★</div><div class="sub" style="color:#fff">${S.mvp?`Top tapper: ${S[S.mvp.team].name}'s fan with ${S.mvp.taps} taps`:''}</div>`,0)}
  $('status').style.display=S.phase==='fight'&&S.beatPhase==='lock'&&S.live&&S.video.seq===curSeq&&!$('ov').innerHTML?'block':'none';$('status').textContent='Next clash incoming…';
  const c=S.call;$('call').style.display=c?'flex':'none';
  if(c){const m=c.text.match(/^(.+?!)\s+(.+)$/),big=m?m[1]:c.text;$('call').innerHTML=`<b class="${big.length>14?'long':''}">${big}</b>${m?`<span>${m[2]}</span>`:''}`}
  playFx();playSay();playTaunt();
}
function playFx(){
  if(S.phase!=='fight'||!S.last||S.last.beat===fx.beat)return;fx.beat=S.last.beat;const l=S.last;
  const pop=(side,txt,c)=>{const d=document.createElement('div');d.className='dmg';d.style.cssText=`--c:${c};${side==='A'?'left':'right'}:14%`;d.textContent=txt;$('stage').appendChild(d);setTimeout(()=>d.remove(),1900)};
  if(l.dA)pop('B','-'+l.dA,COL.A);if(l.dB)pop('A','-'+l.dB,COL.B);
  if(!S.live){const s=c=>{const e=$('mk'+c)&&$('mk'+c).firstElementChild;if(e){e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}};if(l.dA)s('B');if(l.dB)s('A')}
  ov(`<div class="banner pop">${MVL('A',l.ma)} <small>vs</small> ${MVL('B',l.mb)}</div>`,2500);
}
// ---- speech: AUDIO ONLY. The host is the loudest voice; while anyone speaks the video sound is ducked. ----
let lastSay=-1,queue=[],speaking=false;
const duck=on=>[0,1].forEach(i=>{const v=$('v'+i);if(v)v.volume=on?0.12:0.55});
function playSay(){
  if(lastSay<0){lastSay=Math.max(0,...(S.says||[]).map(x=>x.seq));return} // do not replay old lines on load
  for(const x of S.says||[])if(x.seq>lastSay){lastSay=x.seq;queue.push(x)}
  if(queue.length>3)queue=queue.filter((x,i)=>x.who==='host'||i>=queue.length-2);
  pump();
}
function pump(){
  if(speaking||!queue.length)return;
  const s=queue.shift(),pop=$('pop'),hs=s.who==='host'?null:document.querySelectorAll('.hs')[s.who==='A'?0:1];
  const done=()=>{speaking=false;duck(false);if(pop)pop.classList.remove('talk');document.querySelectorAll('.hs').forEach(e=>e.classList.remove('speaking'));pump()};
  speaking=true;duck(true);if(s.who==='host'&&pop)pop.classList.add('talk');if(hs)hs.classList.add('speaking');
  if(!audioOK||!s.url){setTimeout(done,1200);return}   // no sound available: just a short visual cue
  const a=new Audio(s.url);a.volume=s.who==='host'?1:0.75;a.onended=done;a.onerror=done;a.play().catch(done);
}
function playTaunt(){
  const f=S.fx;if(!f||f.seq===fx.fx)return;fx.fx=f.seq;
  document.querySelectorAll('.bub.'+f.from).forEach(e=>e.remove());
  const d=document.createElement('div');d.className='bub '+f.from;d.innerHTML=BR.ART.alien(7);d.style.cssText+=`;${f.from==='A'?'right':'left'}:12%`; // thrown at the OTHER fighter
  $('stage').appendChild(d);setTimeout(()=>d.remove(),2300);
}
