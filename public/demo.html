<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cage Match — Demo</title>
<style>
html,body{margin:0;height:100%;background:#05030a;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:1fr 31vw;height:100vh}
iframe{border:0;width:100%;height:100%;background:#0a0612}
.side{display:flex;flex-direction:column;border-left:1px solid #ffffff18;min-width:0}
.side header{padding:8px 12px;color:#9a8fba;font-size:12px;letter-spacing:.15em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.side iframe{flex:1;min-height:0}
button{font:inherit;font-size:11px;background:#251a3d;color:#fff;border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
</style></head><body>
<div class="wrap">
  <iframe id="scr" src="/screen"></iframe>
  <div class="side"><header><span>📱 The crowd (simulated)</span><span><button onclick="go()">+ join</button></span></header><iframe id="sim" src="/sim?embed=1"></iframe></div>
</div>
<script>
// /demo?n=40&auto=1  -> n virtual phones join automatically (staggered, like people scanning the QR)
const n=new URLSearchParams(location.search).get('n')||'30';
function go(){document.getElementById('sim').src='/sim?embed=1&n='+n+'&auto=1'}
if(new URLSearchParams(location.search).has('auto'))go();
</script></body></html>
